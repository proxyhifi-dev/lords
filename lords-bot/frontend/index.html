<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lords Bot - ORB Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header><h1>Lords Bot — ORB NIFTY Options</h1></header>
  <main class="grid">
    <section><h3>Bot Status</h3><pre id="botStatus"></pre></section>
    <section>
      <h3>Trading Mode Switch</h3>
      <button id="paperBtn">PAPER MODE</button>
      <button id="realBtn">REAL MODE</button>
      <pre id="modeState"></pre>
    </section>
    <section><h3>Market Status</h3><pre id="marketStatus"></pre></section>
    <section><h3>ORB Range Panel</h3><pre id="orbRange"></pre></section>
    <section><h3>Signal Panel</h3><pre id="signalPanel"></pre></section>
    <section><h3>Trade Execution Panel</h3><pre id="executionPanel"></pre></section>
    <section><h3>Trade History</h3><pre id="tradeHistory"></pre></section>
    <section><h3>Performance Metrics</h3><pre id="performance"></pre></section>
    <section>
      <h3>Bot Controls</h3>
      <button id="refreshBtn">Refresh</button>
      <button id="flattenBtn">Flatten Position</button>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
